<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hospital ROLEM</title>
    
    <!--LINKS CSS-->
    <link rel="stylesheet" href="/estilos/login.css">
    <link rel="stylesheet" href="/main.css">

    <!--LINKS CODE EXTERNOS-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav>
        <div class="container">
            <h1>HOSPITAL ROLEM</h1>
            <ul>
                <li><a href="/"><i class='bx bx-home-alt'></i> Inicio</a></li>
                <li><a href="#"><i class='bx bx-bar-chart-square'></i> Servicios</a></li>
                <li><a href="#"><i class='bx bx-book-content'></i> Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            
            <div th:if="${error}" class="alert alert-danger">
                <p th:text="${error}"></p>
            </div>
            
            <div th:if="${success}" class="alert alert-success">
                <p th:text="${success}"></p>
            </div>
            
            <form action="/procesarLogin" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}"/>
                
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu nombre de usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-login">Iniciar Sesión</button>
            </form>
            
            <div class="register-link">
                <p>¿No tienes una cuenta? <a href="/register">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Hospital ROLEM Todos los derechos reservados.</p>
            <a href="">Términos</a>
            <a href="">Privacidad</a>
        </div>
    </footer>
</body>
</html>
