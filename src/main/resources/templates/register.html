<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hospital ROLEM</title>
    
    <!--LINKS CSS-->
    <link rel="stylesheet" href="/estilos/register.css">
    <link rel="stylesheet" href="/main.css">

    <!--LINKS CODE EXTERNOS-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav>
        <div class="container">
            <h1>HOSPITAL ROLEM</h1>
            <ul>
                <li><a href="/"><i class='bx bx-home-alt'></i> Inicio</a></li>
                <li><a href="#"><i class='bx bx-bar-chart-square'></i> Servicios</a></li>
                <li><a href="#"><i class='bx bx-book-content'></i> Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="register-container">
        <div class="register-box">
            <h2>Crear una Cuenta</h2>
            
            <div th:if="${error}" class="alert alert-danger">
                <p th:text="${error}"></p>
            </div>
            
            <div th:if="${success}" class="alert alert-success">
                <p th:text="${success}"></p>
            </div>
            
            <form action="/procesarRegistro" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="identificacion">Número de Identificación:</label>
                        <input type="number" id="identificacion" name="identificacion" placeholder="Ingresa tu número de identificación" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Nombre de Usuario:</label>
                        <input type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" placeholder="Ingresa tu edad" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="number" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="genero">Género:</label>
                        <select id="genero" name="genero" required>
                            <option value="">Selecciona tu género</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Ingresa tu dirección" required>
                </div>
                
                <button type="submit" class="btn btn-register">Registrarse</button>
            </form>
            
            <div class="login-link">
                <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Hospital ROLEM Todos los derechos reservados.</p>
            <a href="">Términos</a>
            <a href="">Privacidad</a>
        </div>
    </footer>
</body>
</html>
