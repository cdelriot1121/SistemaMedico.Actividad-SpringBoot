spring.application.name=SistemaMedico

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_medico_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=rootcar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración adicional
logging.level.org.springframework.web=DEBUG
spring.thymeleaf.cache=false
